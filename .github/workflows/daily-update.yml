name: Update data and publish site

on:
  schedule:
    - cron: "7 13 * * *"   # 13:07 UTC (~8-9 am US Eastern): update data + "last 24 hours" market post
    - cron: "7 2 * * *"    # 02:07, 05:07, 08:07 UTC (overnight US Eastern; daytime Asia, morning Europe):
    - cron: "7 5 * * *"    #   three themed "Spotlight" leaderboard posts, 5+ hours from the two main posts
    - cron: "7 8 * * *"
    - cron: "37 3 * * *"   # 03:37 UTC = 9:37 am Dhaka: Bangladesh last-24-hours post (Facebook only)
    - cron: "7 21 * * *"   # 21:07 UTC (~4-5 pm US Eastern): full "Today in Research" report post
  workflow_dispatch:         # "Run workflow" button in the Actions tab
    inputs:
      mode:
        description: "full = normal update; totals-only = just save the 24-hour starting snapshot"
        type: choice
        options: [full, totals-only]
        default: full
  push:
    branches: [main]         # re-publish when you edit the website or write a blog post
    paths-ignore: ["data/**", "posts/daily/**", "posts/images/cards/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: researchboard
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    env:
      SPOTLIGHT_SLOT: ${{ github.event.schedule == '7 2 * * *' && '0' || (github.event.schedule == '7 5 * * *' && '1' || (github.event.schedule == '7 8 * * *' && '2' || '')) }}
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install blog tools
        run: pip install markdown==3.7 pillow==11.3.0

      - name: Collect the latest numbers
        if: github.event_name != 'push' && github.event.schedule != '7 21 * * *' && env.SPOTLIGHT_SLOT == '' && github.event.schedule != '37 3 * * *' && github.event.inputs.mode != 'totals-only'
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          EXTRA_COUNTRIES: ${{ vars.EXTRA_COUNTRIES }}
        run: python scripts/update_data.py

      - name: Write today's automatic blog post and image card
        if: github.event_name != 'push' && github.event.schedule != '7 21 * * *' && env.SPOTLIGHT_SLOT == '' && github.event.schedule != '37 3 * * *' && github.event.inputs.mode != 'totals-only'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          python scripts/build_blog.py --daily
          python scripts/social_card.py --market || true

      - name: Draw today's Spotlight card
        if: env.SPOTLIGHT_SLOT != ''
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          python scripts/spotlight.py --card
          git config user.name  "researchboard-bot"
          git config user.email "researchboard-bot@users.noreply.github.com"
          git add posts/images/cards/
          git commit -m "Spotlight card $(date -u +%F)" || true
          git pull --rebase --autostash origin main || true
          git push || true

      - name: Bangladesh 24-hour snapshot and card
        if: github.event.schedule == '37 3 * * *'
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          python scripts/country_watch.py
          git config user.name  "researchboard-bot"
          git config user.email "researchboard-bot@users.noreply.github.com"
          git add data/ posts/images/cards/
          git commit -m "Bangladesh 24-hour snapshot $(date -u +%F)" || true
          git pull --rebase --autostash origin main || true
          git push || true

      - name: Build the blog
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          python scripts/guides.py || true
          python scripts/build_blog.py

      - name: Save the new data to the repository
        if: github.event_name != 'push' && github.event.schedule != '7 21 * * *' && env.SPOTLIGHT_SLOT == '' && github.event.schedule != '37 3 * * *' && github.event.inputs.mode != 'totals-only'
        run: |
          git config user.name  "researchboard-bot"
          git config user.email "researchboard-bot@users.noreply.github.com"
          git add data/ posts/daily/ posts/images/cards/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Daily data update $(date -u +%F)"
            git pull --rebase --autostash origin main || true
            git push
          fi

      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r index.html assets blog _site/
          mv _site/blog/sitemap.xml _site/blog/robots.txt _site/ 2>/dev/null || true
          if [ -f _site/blog/_index.html ]; then mv _site/blog/_index.html _site/index.html; fi
          if [ -d country ]; then cp -r country _site/; fi
          if [ -d data ]; then cp -r data _site/; fi
          if [ -d site_extra ]; then cp -r site_extra/* _site/; fi
          mkdir -p _site/data
          if [ -f _site/blog/_search-index.json ]; then mv _site/blog/_search-index.json _site/data/search-index.json; fi
          rm -f _site/data/*snapshot*.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Save the 24-hour starting snapshot only
        if: github.event.inputs.mode == 'totals-only'
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: |
          python scripts/update_data.py --totals-only
          git config user.name  "researchboard-bot"
          git config user.email "researchboard-bot@users.noreply.github.com"
          git add data/totals_snapshot.json
          git commit -m "24-hour starting snapshot $(date -u +%F)" || true
          git pull --rebase --autostash origin main || true
          git push

      - name: Post to social media
        if: github.event_name != 'push' && github.event.inputs.mode != 'totals-only'
        continue-on-error: true
        env:
          SOCIAL_MODE: ${{ github.event.schedule == '37 3 * * *' && 'bd' || (github.event.schedule == '7 21 * * *' && 'report' || (env.SPOTLIGHT_SLOT != '' && 'spotlight' || (github.event_name == 'schedule' && 'market' || 'both'))) }}
          SITE_URL: ${{ vars.SITE_URL }}
          FB_GRAPH_VERSION: ${{ vars.FB_GRAPH_VERSION }}
          LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_AUTHOR: ${{ secrets.LINKEDIN_AUTHOR }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
        run: |
          python scripts/post_social.py
          if [ -n "$(git status --porcelain -- data/social_log.json)" ]; then
            git add data/social_log.json
            git commit -m "Social posts $(date -u +%F)"
            git pull --rebase --autostash origin main || true
            git push
          fi
