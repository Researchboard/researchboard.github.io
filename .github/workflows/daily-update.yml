name: Update data and publish site

on:
  schedule:
    - cron: "17 6 * * *"   # every day at 06:17 UTC (after the UTC day has closed)
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:
    branches: [main]         # re-publish when you edit the website files
    paths-ignore: ["data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: researchboard
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: "3.12"

      - name: Collect the latest numbers
        if: github.event_name != 'push'
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          EXTRA_COUNTRIES: ${{ vars.EXTRA_COUNTRIES }}
        run: python scripts/update_data.py

      - name: Save the new data to the repository
        if: github.event_name != 'push'
        run: |
          git config user.name  "researchboard-bot"
          git config user.email "researchboard-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Daily data update $(date -u +%F)"
            git push
          fi

      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r index.html assets _site/
          if [ -d data ]; then cp -r data _site/; fi
          rm -f _site/data/*snapshot*.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
