name: Update data and publish site

on:
  schedule:
    - cron: "17 6 * * *"   # every day at 06:17 UTC (after the UTC day has closed)
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:
    branches: [main]         # re-publish when you edit the website or write a blog post
    paths-ignore: ["data/**", "posts/daily/**", "posts/images/cards/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: researchboard
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install blog tools
        run: pip install markdown==3.7 pillow==11.3.0

      - name: Collect the latest numbers
        if: github.event_name != 'push'
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          EXTRA_COUNTRIES: ${{ vars.EXTRA_COUNTRIES }}
        run: python scripts/update_data.py

      - name: Write today's automatic blog post and image card
        if: github.event_name != 'push'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/build_blog.py --daily

      - name: Build the blog
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/build_blog.py

      - name: Save the new data to the repository
        if: github.event_name != 'push'
        run: |
          git config user.name  "researchboard-bot"
          git config user.email "researchboard-bot@users.noreply.github.com"
          git add data/ posts/daily/ posts/images/cards/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Daily data update $(date -u +%F)"
            git pull --rebase --autostash origin main || true
            git push
          fi

      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r index.html assets blog _site/
          if [ -d data ]; then cp -r data _site/; fi
          rm -f _site/data/*snapshot*.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Post to social media
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          FB_GRAPH_VERSION: ${{ vars.FB_GRAPH_VERSION }}
          LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_AUTHOR: ${{ secrets.LINKEDIN_AUTHOR }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
        run: |
          python scripts/post_social.py
          if [ -n "$(git status --porcelain -- data/social_log.json)" ]; then
            git add data/social_log.json
            git commit -m "Social posts $(date -u +%F)"
            git pull --rebase --autostash origin main || true
            git push
          fi
