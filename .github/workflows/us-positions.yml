name: US open positions

# Collects open postdoc and graduate positions from US universities' official job feeds
# for the "US open positions" tab on /study/. Data only: it never posts to social media.
# Runs every day, and when the collector script changes.
on:
  schedule:
    - cron: "23 10 * * *"    # daily 10:23 UTC (5:23 AM Eastern)
  push:
    branches: [main]
    paths: ["scripts/us_positions.py", ".github/workflows/us-positions.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us-positions-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect open positions
        run: python -u scripts/us_positions.py
      - name: Save the data
        run: |
          git config user.name  "researchboard-bot"
          git config user.email "researchboard-bot@users.noreply.github.com"
          git add data/positions/us.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "US open positions $(date -u +%F)"
            git pull --rebase --autostash origin main || true
            git push
          fi
